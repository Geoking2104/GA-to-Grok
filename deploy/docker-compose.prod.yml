services:
  caddy:
    image: caddy:2-alpine
    container_name: ga-grok-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS}"
      CADDY_EMAIL: "${CADDY_EMAIL}"
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - ga_grok

  app:
    build: .
    container_name: ga-grok-app
    # No published port: only reachable through Caddy on the internal network.
    environment:
      - TRANSPORT=http
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/service-account.json
      - MCP_API_TOKEN=${MCP_API_TOKEN}
      - GA4_WRITE_ENABLED=${GA4_WRITE_ENABLED:-false}
      - GTM_WRITE_ENABLED=${GTM_WRITE_ENABLED:-false}
      - GA4_PROPERTY_ID=${GA4_PROPERTY_ID:-}
      - REDIS_URL=redis://redis:6379
      - CACHE_TTL_REPORT=${CACHE_TTL_REPORT:-600}
      - CACHE_TTL_METADATA=${CACHE_TTL_METADATA:-3600}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ./service-account.json:/secrets/service-account.json:ro
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - ga_grok

  redis:
    image: redis:7-alpine
    container_name: ga-grok-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - ga_grok

networks:
  ga_grok:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  redis_data:
